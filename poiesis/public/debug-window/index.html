<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Poiesis Debug</title>
<style>
  *, *::before, *::after { box-sizing: border-box; }
  body {
    margin: 0; padding: 0;
    font-family: system-ui, sans-serif;
    background: transparent;
    color: #333;
  }
  /* 编译产物容器（替代 P38 沙箱 iframe：调试自己写的应用不设沙箱，
      WASM 多文件编译的 HTML 直接加载进本页，未来 WASM 侧可加调试原语） */
  #root {
    width: 100vw; height: 100vh; overflow: auto;
  }

  /* ── Floating Debug Ball ── */
  #debug-ball {
    position: fixed; top: 16px; right: 16px;
    width: 44px; height: 44px; border-radius: 50%;
    background: #22c55e; cursor: pointer; z-index: 100000;
    box-shadow: 0 2px 12px rgba(0,0,0,0.25);
    display: flex; align-items: center; justify-content: center;
    font-size: 20px; user-select: none;
    transition: transform 0.2s, opacity 0.2s, background 0.2s;
  }
  #debug-ball:hover { transform: scale(1.1); }
  #debug-ball.hidden { transform: scale(0.5); opacity: 0; pointer-events: none; }

  /* ── Inspector Panel ── */
  #debug-panel {
    position: fixed; top: 16px; right: 16px;
    width: 300px; max-height: 480px;
    background: #1e1e2e; color: #cdd6f4;
    border-radius: 12px; box-shadow: 0 8px 32px rgba(0,0,0,0.45);
    z-index: 99999; overflow: hidden; display: none;
  }
  #debug-panel.visible { display: flex; flex-direction: column; }
  #debug-panel .panel-header {
    padding: 10px 14px; font-size: 11px; font-weight: 600;
    text-transform: uppercase; color: #a6adc8; letter-spacing: 0.6px;
    border-bottom: 1px solid #313244; display: flex;
    justify-content: space-between; align-items: center;
  }
  #debug-panel .panel-drag-handle { cursor: grab; flex: 1; user-select: none; }
  #debug-panel .panel-drag-handle:active { cursor: grabbing; }
  #debug-panel .panel-close {
    width: 22px; height: 22px; border-radius: 50%; background: #313244;
    border: none; color: #a6adc8; cursor: pointer; font-size: 14px;
    display: flex; align-items: center; justify-content: center; line-height: 1;
  }
  #debug-panel .panel-close:hover { background: #45475a; color: #cdd6f4; }
  #debug-panel .panel-body {
    flex: 1; overflow-y: auto; font-size: 13px;
    font-family: 'Consolas', 'JetBrains Mono', monospace;
  }
  #debug-panel .signal-row {
    padding: 5px 14px; display: flex; justify-content: space-between; align-items: center;
  }
  #debug-panel .signal-row:hover { background: #313244; }
  #debug-panel .signal-name { color: #89b4fa; }
  #debug-panel .signal-value {
    color: #a6e3a1; max-width: 140px; overflow: hidden;
    text-overflow: ellipsis; white-space: nowrap;
  }
  #debug-panel .action-row { padding: 4px 14px; font-size: 12px; color: #f9e2af; }
  #debug-panel .empty-hint { padding: 8px 14px; color: #6c7086; font-size: 12px; }

  /* Debug-mode highlight */
  body.debug-active [data-nid] { cursor: crosshair; }
  body.debug-active [data-nid]:hover { outline: 2px dashed #6366f1; outline-offset: 1px; }
</style>
</head>
<body>
<!-- 编译产物直载容器：WASM 编译的 HTML 由 applyCompile 写入（CSS→style、正文→innerHTML、脚本按序执行）。
     不设沙箱 iframe —— 本窗口只有 core:event 两权限，编译产物直连 Tauri 事件即可，
     postMessage 桥接层整体移除（旧桥的捕获阶段 stopPropagation 会吞掉应用全部点击）。 -->
<div id="root"></div>

<!-- Floating Debug Ball -->
<div id="debug-ball" title="Toggle inspector">🔍</div>

<!-- Inspector Panel -->
<div id="debug-panel">
  <div class="panel-header">
    <span class="panel-drag-handle" id="panel-drag-handle">📊 Store Inspector</span>
    <button class="panel-close" id="panel-close" title="Close inspector">×</button>
  </div>
  <div class="panel-body">
    <div class="panel-header" style="font-size:10px;padding:6px 14px;">🔵 Signals</div>
    <div id="signal-list"><div class="empty-hint">(no signals)</div></div>
    <div class="panel-header" style="font-size:10px;padding:6px 14px;">📋 Actions</div>
    <div id="action-list"><div class="empty-hint">(no actions)</div></div>
    <div class="panel-header" style="font-size:10px;padding:6px 14px;">🔄 Compile</div>
    <div id="compile-info" style="padding:6px 14px;font-size:11px;color:#6c7086;">Waiting…</div>
  </div>
</div>

<script>
(function() {
  var rootEl = document.getElementById('root');
  var ball = document.getElementById('debug-ball');
  var panel = document.getElementById('debug-panel');
  var signalList = document.getElementById('signal-list');
  var actionList = document.getElementById('action-list');
  var compileInfo = document.getElementById('compile-info');
  var debugActive = false;
  var refreshTimer = null;

  var internals = window.__TAURI_INTERNALS__;
  if (!internals) {
    rootEl.innerHTML = '<h1 style="color:red;padding:40px;">Error: Tauri API not available</h1>';
    throw new Error('Tauri API not available');
  }
  if (typeof internals.transformCallback !== 'function') {
    rootEl.innerHTML = '<h1 style="color:red;padding:40px;">Error: transformCallback missing</h1>';
    throw new Error('transformCallback missing');
  }

  // ═══ Panel Drag ═══
  (function() {
    var handle = document.getElementById('panel-drag-handle');
    var dragging = false, startX, startY, startLeft, startTop;

    handle.addEventListener('mousedown', function(e) {
      dragging = true;
      startX = e.clientX; startY = e.clientY;
      startLeft = panel.offsetLeft; startTop = panel.offsetTop;
      e.preventDefault();
    });
    document.addEventListener('mousemove', function(e) {
      if (!dragging) return;
      var dx = e.clientX - startX, dy = e.clientY - startY;
      panel.style.left = (startLeft + dx) + 'px';
      panel.style.top = (startTop + dy) + 'px';
      panel.style.right = 'auto';
    });
    document.addEventListener('mouseup', function() { dragging = false; });
  })();

  // ═══ Toggle debug mode ═══
  function setDebugActive(on) {
    debugActive = on;
    if (on) {
      ball.classList.add('hidden');
      panel.classList.add('visible');
      document.body.classList.add('debug-active');
      refreshInspector();
      refreshTimer = setInterval(refreshInspector, 500);
    } else {
      ball.classList.remove('hidden');
      panel.classList.remove('visible');
      document.body.classList.remove('debug-active');
      if (refreshTimer) { clearInterval(refreshTimer); refreshTimer = null; }
    }
  }

  ball.addEventListener('click', function() { setDebugActive(true); });
  document.getElementById('panel-close').addEventListener('click', function() { setDebugActive(false); });

  // ═══ 编译产物直载（替代 srcdoc iframe 组装）═══
  // css → <style>；html 正文 → #root（脚本剥离按文档序收集）；脚本按序 (0,eval) 执行。
  // payload.js 仅在 payload.html 无脚本时回退 —— 旧 srcdoc 方案尾部再拼 payload.js
  // 导致 app JS 执行两遍，直载方案消除。
  function applyCompile(payload) {
    // 1) CSS
    var styleEl = document.getElementById('omni-styles');
    if (!styleEl) {
      styleEl = document.createElement('style');
      styleEl.id = 'omni-styles';
      document.head.appendChild(styleEl);
    }
    styleEl.textContent = payload.css || '';

    // 2) HTML 正文（脚本剥离）
    var tmp = document.createElement('div');
    tmp.innerHTML = payload.html || '';
    var scripts = [];
    var frag = document.createDocumentFragment();
    for (var i = 0; i < tmp.childNodes.length; i++) {
      var n = tmp.childNodes[i];
      if (n.nodeType === 1 && n.tagName === 'SCRIPT') { scripts.push(n.textContent); continue; }
      frag.appendChild(n);
    }
    // 编译产物静态 body 以 <div id="root"> 占位时解包（本页 #root 即应用容器，避免重复 id）
    if (frag.childNodes.length === 1) {
      var only = frag.firstChild;
      if (only && only.nodeType === 1 && only.id === 'root') {
        var unwrapped = document.createDocumentFragment();
        while (only.firstChild) unwrapped.appendChild(only.firstChild);
        frag = unwrapped;
      }
    }
    rootEl.textContent = ''; // 清空上一次应用运行
    rootEl.appendChild(frag);

    // 3) 脚本按文档序执行
    if (scripts.length === 0 && payload.js) scripts.push(payload.js);
    // 暴露最近一次编译的脚本（调试窗口排查编译产物用；与 runtime 的 __omni_debug 呼应）
    window.__omni_loadedScripts = scripts;
    scripts.forEach(function(code, idx) {
      try { (0, eval)(code); }
      catch (err) {
        compileInfo.textContent = 'Script[' + idx + '] error: ' + err.message;
        console.error('[Poiesis debug] script ' + idx + ' failed:', err);
      }
    });
  }

  // ═══ Refresh inspector — 直读编译运行时（同一文档，无需 postMessage）═══
  // runtime v2 的信号注册进 window.__omni_subs（Map<name, signal>，含 peek）；
  // __omni_signals 恒为空（runtime v2 不再填充），仅作旧产物回退。
  function refreshInspector() {
    var signals = {};
    try {
      var subs = window.__omni_subs || window.__omni_signals || null;
      if (subs) {
        if (typeof subs.forEach === 'function') { // runtime v2: Map
          subs.forEach(function(sig, name) {
            try { signals[name] = typeof sig.peek === 'function' ? sig.peek() : sig; }
            catch (_) { signals[name] = '<error>'; }
          });
        } else {
          Object.keys(subs).forEach(function(k) {
            try { signals[k] = typeof subs[k].peek === 'function' ? subs[k].peek() : subs[k]; }
            catch (_) { signals[k] = '<error>'; }
          });
        }
      }
    } catch (_) {}
    updateSignalDisplay(signals);
  }

  function updateSignalDisplay(signals) {
    var signalKeys = Object.keys(signals);
    if (signalKeys.length > 0) {
      signalList.innerHTML = '';
      signalKeys.forEach(function(k) {
        var val = signals[k];
        if (typeof val === 'object') val = JSON.stringify(val).substring(0, 60);
        else if (typeof val === 'function') val = '[fn]';
        else val = String(val);

        var row = document.createElement('div');
        row.className = 'signal-row';

        var nameSpan = document.createElement('span');
        nameSpan.className = 'signal-name';
        nameSpan.textContent = k;

        var valSpan = document.createElement('span');
        valSpan.className = 'signal-value';
        valSpan.textContent = val;

        row.appendChild(nameSpan);
        row.appendChild(valSpan);
        signalList.appendChild(row);
      });
    } else {
      signalList.innerHTML = '';
      var emptyHint = document.createElement('div');
      emptyHint.className = 'empty-hint';
      emptyHint.textContent = '(no signals)';
      signalList.appendChild(emptyHint);
    }

    var storeNames = new Set();
    signalKeys.forEach(function(k) {
      var parts = k.split('_');
      if (parts.length >= 2) storeNames.add(parts[0]);
    });
    var storeArr = Array.from(storeNames);
    if (storeArr.length > 0) {
      actionList.innerHTML = '';
      storeArr.forEach(function(sn) {
        var div = document.createElement('div');
        div.className = 'action-row';
        div.textContent = '📦 ' + sn;
        actionList.appendChild(div);
      });
    } else {
      actionList.innerHTML = '';
      var emptyAction = document.createElement('div');
      emptyAction.className = 'empty-hint';
      emptyAction.textContent = '(no actions)';
      actionList.appendChild(emptyAction);
    }
  }

  // ═══ Element-select: 捕获阶段点击 → Tauri 事件 ═══
  // 只在 inspector 激活时拦截（旧 shell 桥无条件 stopPropagation 吞掉 iframe 内全部点击
  // —— 应用按钮永远不响应的根因；激活态也只 stopPropagation 不 preventDefault，
  // 保留输入框聚焦等原生行为）。非激活态完全不介入，按钮正常工作。
  document.addEventListener('click', function(e) {
    if (!debugActive) return;
    var el = e.target && e.target.closest ? e.target.closest('[data-nid]') : null;
    if (!el) return;
    e.stopPropagation();
    internals.invoke('plugin:event|emit', {
      event: 'debug:element-click',
      payload: { nid: el.getAttribute('data-nid'), tag: e.target.tagName.toLowerCase() }
    }).catch(function() {});
  }, true);

  // ═══ Highlight: 直接 DOM（同文档）═══
  var highlightCb = internals.transformCallback(function(e) {
    var payload = typeof e.payload === 'string' ? JSON.parse(e.payload) : e.payload;
    document.querySelectorAll('[data-nid]').forEach(function(el) { el.style.outline = ''; });
    if (payload && payload.nid) {
      var el = document.querySelector('[data-nid="' + payload.nid + '"]');
      if (el) { el.style.outline = '3px solid #6366f1'; el.scrollIntoView({ behavior: 'smooth', block: 'center' }); }
    }
  });
  internals.invoke('plugin:event|listen', {
    event: 'debug:highlight',
    target: { kind: 'Any' },
    handler: highlightCb
  }).catch(function() {});

  // ═══ Hot-replace: 直接 eval 组件 JS（旧桥同款保存/恢复信号状态）═══
  internals.invoke('plugin:event|listen', {
    event: 'debug:hot-replace',
    target: { kind: 'Any' },
    handler: internals.transformCallback(function(e) {
      var payload = typeof e.payload === 'string' ? JSON.parse(e.payload) : e.payload;
      if (!payload || !payload.components) return;
      var names = Object.keys(payload.components);
      compileInfo.textContent = 'Hot-replace: ' + names.join(', ') + ' @ ' + new Date().toLocaleTimeString();
      Object.keys(payload.components).forEach(function(name) {
        var comp = payload.components[name]; if (!comp || !comp.js) return;
        var old = window.__omni_components && window.__omni_components[name];
        var saved = {};
        if (old && old.signals) {
          Object.keys(old.signals).forEach(function(k) {
            try { saved[k] = old.signals[k].peek(); } catch(_) {}
          });
        }
        var root = document.querySelector('[data-component="' + name + '"]');
        if (root) {
          var clone = root.cloneNode(true);
          if (root.parentNode) root.parentNode.replaceChild(clone, root);
        }
        try {
          var newComp = (0, eval)(comp.js);
          if (!window.__omni_components) window.__omni_components = {};
          window.__omni_components[name] = newComp;
          if (newComp && newComp.signals) {
            Object.keys(saved).forEach(function(k) {
              try { if (newComp.signals[k]) newComp.signals[k].set(saved[k]); } catch(_) {}
            });
          }
        } catch(_) {}
      });
    })
  }).catch(function(err) {
    compileInfo.textContent = 'Hot-replace listen FAILED: ' + JSON.stringify(err);
  });

  // ═══ Compile result handler — 直载 ═══
  var compileCb = internals.transformCallback(function(e) {
    try {
      var payload = typeof e.payload === 'string' ? JSON.parse(e.payload) : e.payload;
      if (!payload) return;

      var scriptCount = (payload.html || '').split('<script').length - 1;
      compileInfo.textContent = 'Last: ' + new Date().toLocaleTimeString() +
        ' (JS:' + (payload.js ? payload.js.length + 'B' : '0') +
        ' HTML:' + (payload.html ? payload.html.length + 'B' : '0') +
        ' CSS:' + (payload.css ? payload.css.length + 'B' : '0') +
        ' scripts:' + scriptCount + ')';

      applyCompile(payload);
    } catch (err) {
      compileInfo.textContent = 'Handler error: ' + err.message;
    }
  });

  internals.invoke('plugin:event|listen', {
    event: 'debug:compile-result',
    target: { kind: 'Any' },
    handler: compileCb
  }).catch(function(err) {
    compileInfo.textContent = 'Listen FAILED: ' + JSON.stringify(err);
  });

  // ═══ Notify main window ═══
  internals.invoke('plugin:event|emit', {
    event: 'debug:window-ready', payload: {}
  }).then(function() {
    compileInfo.textContent = 'Connected. Waiting for compile…';
  }).catch(function(err) {
    compileInfo.textContent = 'Ready emit FAILED: ' + JSON.stringify(err);
  });
})();
</script>
</body>
</html>
