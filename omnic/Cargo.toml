[package]
name = "omnic"
version = "0.2.0"
edition = "2021"
description = "OmniLang CLI — compile .omni to 10+ targets"

[[bin]]
name = "omnic"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
pathdiff = "0.2"
rustc-hash = "2"

[dependencies.omnilang]
path = "../omnilang"
features = ["codegen-omniview", "codegen-react", "codegen-flutter"]
