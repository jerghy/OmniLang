<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>账单概览</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    background: #f5f6fa;
    color: #222;
    padding: 24px 32px;
  }

  /* ===== Bill Overview Section ===== */
  .bill-section {
    background: #fff;
    border-radius: 8px;
    padding: 24px 28px;
    margin-bottom: 20px;
    box-shadow: 0 1px 3px rgba(0,0,0,.06);
  }
  .section-head {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 20px;
  }
  .section-head h2 {
    font-size: 18px;
    font-weight: 600;
    color: #1a1a1a;
  }
  .section-head a {
    color: #1a6fd4;
    font-size: 14px;
    text-decoration: none;
  }
  .section-head a:hover { text-decoration: underline; }

  /* Table */
  .table-wrap {
    width: 100%;
    overflow-x: auto;
  }
  table.bill-table {
    width: 100%;
    min-width: 820px;
    border-collapse: collapse;
  }
  .bill-table thead th {
    background: #f7f8fc;
    color: #666;
    font-weight: 500;
    font-size: 14px;
    text-align: left;
    padding: 12px 16px;
    border-bottom: 1px solid #e8e9ef;
    white-space: nowrap;
  }
  .bill-table tbody td {
    padding: 14px 16px;
    font-size: 14px;
    border-bottom: 1px solid #f2f3f7;
    white-space: nowrap;
  }
  .bill-table tbody tr:last-child td { border-bottom: none; }
  .payer-tag {
    display: inline-block;
    background: #eef2ff;
    color: #4e5ba6;
    padding: 2px 10px;
    border-radius: 3px;
    font-size: 13px;
  }
  .amount { font-weight: 500; }
  .action-links a {
    color: #1a6fd4;
    text-decoration: none;
    margin-right: 16px;
    font-size: 14px;
  }
  .action-links a:hover { text-decoration: underline; }

  /* Scrollbar */
  .scroll-track {
    height: 6px;
    background: #e0e2ea;
    border-radius: 3px;
    margin-top: 14px;
    position: relative;
  }
  .scroll-thumb {
    height: 6px;
    width: 35%;
    background: #b0b4c0;
    border-radius: 3px;
    position: absolute;
    left: 0;
  }

  /* ===== Cost Trend Section ===== */
  .trend-section {
    background: #fff;
    border-radius: 8px;
    padding: 24px 28px;
    box-shadow: 0 1px 3px rgba(0,0,0,.06);
  }
  .trend-head {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 8px;
  }
  .trend-left {
    display: flex;
    align-items: baseline;
    gap: 10px;
  }
  .trend-left h2 {
    font-size: 18px;
    font-weight: 600;
  }
  .trend-update {
    color: #999;
    font-size: 12px;
  }

  /* Report selector */
  .report-bar {
    display: flex;
    align-items: center;
    gap: 0;
    margin-bottom: 28px;
  }
  .report-label {
    background: #f7f8fc;
    border: 1px solid #d8dae3;
    border-right: none;
    border-radius: 4px 0 0 4px;
    padding: 8px 14px;
    font-size: 13px;
    color: #444;
    white-space: nowrap;
  }
  .report-select {
    border: 1px solid #d8dae3;
    border-radius: 0 4px 4px 0;
    padding: 8px 30px 8px 12px;
    font-size: 13px;
    color: #222;
    background: #fff;
    cursor: pointer;
    min-width: 220px;
    appearance: auto;
  }

  /* Chart area */
  .chart-area {
    display: flex;
    position: relative;
    height: 280px;
  }
  .y-axis {
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    padding-bottom: 28px;
    padding-right: 10px;
  }
  .y-label {
    font-size: 12px;
    color: #999;
    text-align: right;
    line-height: 1;
  }
  .chart-body {
    flex: 1;
    position: relative;
    border-left: 1px solid #e8e9ef;
    border-bottom: 1px solid #e8e9ef;
    padding-bottom: 28px;
    display: flex;
    align-items: flex-end;
    gap: 40px;
    padding-left: 50px;
  }

  /* Grid lines */
  .grid-line {
    position: absolute;
    left: 0;
    right: 0;
    border-top: 1px dashed #e8e9ef;
  }

  /* Bars */
  .bar-group {
    display: flex;
    flex-direction: column;
    align-items: center;
    position: relative;
    z-index: 1;
  }
  .bar {
    width: 60px;
    border-radius: 4px 4px 0 0;
    position: relative;
    min-height: 4px;
  }
  .bar-green { background: #6ec5a0; }
  .bar-dark  { background: #4a5e7a; }

  .bar-segment {
    width: 60px;
    position: absolute;
    left: 0;
  }
  .bar-segment.green { background: #6ec5a0; }
  .bar-segment.dark  { background: #4a5e7a; }

  .bar-label {
    position: absolute;
    bottom: -24px;
    font-size: 11px;
    color: #999;
    white-space: nowrap;
  }

  /* x-axis labels */
  .x-labels {
    display: flex;
    gap: 40px;
    padding-left: 50px;
    margin-top: 6px;
    position: relative;
    z-index: 1;
  }
  .x-label-item {
    width: 60px;
    text-align: center;
    font-size: 11px;
    color: #999;
  }
</style>
</head>
<body>

<!-- ====== 近三月账单概览 ====== -->
<div class="bill-section">
  <div class="section-head">
    <h2>近三月账单概览</h2>
    <a href="#">前往账单概览 ›</a>
  </div>

  <div class="table-wrap">
    <table class="bill-table">
      <thead>
        <tr>
          <th>Payer账号</th>
          <th>账务账期</th>
          <th>应付金额</th>
          <th>现金支付</th>
          <th>信控额</th>
          <th>操作</th>
        </tr>
      </thead>
      <tbody>
        <tr>
          <td><span class="payer-tag">8087手机用户#...</span></td>
          <td>2026-06</td>
          <td class="amount">¥0.00</td>
          <td>¥0.00</td>
          <td>¥0.00</td>
          <td class="action-links">
            <a href="#">月账单</a>
            <a href="#">账单明细</a>
          </td>
        </tr>
        <tr>
          <td><span class="payer-tag">8087手机用户#...</span></td>
          <td>2026-05</td>
          <td class="amount">-</td>
          <td>-</td>
          <td>-</td>
          <td class="action-links">
            <a href="#">月账单</a>
            <a href="#">账单明细</a>
          </td>
        </tr>
        <tr>
          <td><span class="payer-tag">8087手机用户#...</span></td>
          <td>2026-04</td>
          <td class="amount">¥174.74</td>
          <td>¥174.74</td>
          <td>¥0.00</td>
          <td class="action-links">
            <a href="#">月账单</a>
            <a href="#">账单明细</a>
          </td>
        </tr>
      </tbody>
    </table>
  </div>

  <div class="scroll-track">
    <div class="scroll-thumb"></div>
  </div>
</div>

<!-- ====== 费用趋势 ====== -->
<div class="trend-section">
  <div class="trend-head">
    <div class="trend-left">
      <h2>费用趋势</h2>
      <span class="trend-update">数据更新至2026-06-08</span>
    </div>
    <a href="#">前往费用分析 ›</a>
  </div>

  <div class="report-bar">
    <span class="report-label">报告模版</span>
    <select class="report-select">
      <option selected>按产品汇总的月度费用</option>
    </select>
  </div>

  <!-- Chart -->
  <div class="chart-area" style="height:280px;">
    <!-- Y axis -->
    <div class="y-axis">
      <span class="y-label">¥200.00</span>
      <span class="y-label">¥150.00</span>
      <span class="y-label">¥100.00</span>
      <span class="y-label">¥50.00</span>
      <span class="y-label">¥0.00</span>
    </div>

    <!-- Chart plot area -->
    <div class="chart-body" id="chartBody">
      <!-- Grid lines at y positions -->
    </div>
  </div>

  <!-- X labels -->
  <div class="x-labels">
    <div class="x-label-item">2026-06</div>
    <div class="x-label-item" style="margin-left:0;">2026-05</div>
  </div>
</div>

<script>
(function() {
  const chartBody = document.getElementById('chartBody');
  const chartHeight = 280 - 28; // total minus x-axis padding
  const maxY = 200;

  // Draw grid lines
  const gridValues = [200, 150, 100, 50, 0];
  gridValues.forEach(v => {
    const yPct = 1 - (v / maxY);
    const top = yPct * chartHeight;
    const line = document.createElement('div');
    line.className = 'grid-line';
    line.style.top = top + 'px';
    chartBody.appendChild(line);
  });

  // Data points: { label, values: [{height, type}] }
  // Jun: ~20 (small green bar)
  // May: ~175 (split: 150 green + 25 dark)
  const bars = [
    {
      label: '2026-06',
      segments: [
        { val: 20,  type: 'green' }
      ]
    },
    {
      label: '2026-05',
      segments: [
        { val: 150, type: 'green' },
        { val: 25,  type: 'dark'  }
      ]
    }
  ];

  bars.forEach((barData, i) => {
    const group = document.createElement('div');
    group.className = 'bar-group';
    group.style.height = chartHeight + 'px';
    group.style.position = 'relative';

    let cumY = 0;
    barData.segments.forEach(seg => {
      const h = (seg.val / maxY) * chartHeight;
      const segEl = document.createElement('div');
      segEl.className = 'bar-segment ' + (seg.type === 'green' ? 'green' : 'dark');
      segEl.style.bottom = cumY + 'px';
      segEl.style.height = Math.max(h, 2) + 'px';
      segEl.style.width = '60px';
      segEl.style.borderRadius = seg.type === 'dark' ? '0 0 0 0' : (barData.segments.length === 1 ? '4px 4px 0 0' : '0 0 0 0');
      group.appendChild(segEl);
      cumY += h;
    });

    // Top bar gets border-radius
    const allSegs = group.querySelectorAll('.bar-segment');
    if (allSegs.length > 0) {
      allSegs[allSegs.length - 1].style.borderRadius = '4px 4px 0 0';
    }

    chartBody.appendChild(group);
  });
})();
</script>

</body>
</html>
