[P0101]
title = "Cross-language integer division behavior"
category = "portability"
severity = "port"
summary = "Integer division `/` on `i32` types behaves differently across target languages."
description = """
In OmniLang, `a / b` on `i32` types compiles to different operations per target:

- **JS**: Returns a JavaScript `number` (float). 5 / 2 = 2.5
- **Dart**: Truncates toward zero. 5 / 2 = 2, -5 / 2 = -2
- **Rust**: Truncates toward zero. Same as Dart.
- **Python**: Floors toward negative infinity. 5 / 2 = 2, -5 / 2 = -3

This behavior divergence can cause subtle bugs when code is compiled to multiple targets.
"""
fix = "Use `_idiv(a, b)` from `omni/math` for portable integer division with consistent truncation-toward-zero behavior."

[P0102]
title = "Float comparison precision differences"
category = "portability"
severity = "port"
summary = "Floating-point equality (`==`, `!=`) may produce different results across platforms."
description = """
IEEE 754 floating-point operations can differ slightly across:
- Different hardware architectures (x86 vs ARM)
- Different language runtimes (JS V8 vs Dart VM vs CPython)
- Different optimization levels (Rust debug vs release)

Direct `f64 == f64` comparisons are fragile for cross-language code.
"""
fix = "Use an epsilon-based comparison: `abs(a - b) < 1e-10` instead of `a == b`."

[P0109]
title = "Integer overflow behavior"
category = "portability"
severity = "port"
summary = "Integer arithmetic may overflow differently across target languages."
description = """
- **JS**: Automatically switches to floating-point for large integers (up to 2^53).
- **Dart**: Wraps on overflow (like C unsigned).
- **Rust**: Panics in debug mode, wraps in release (two's complement).
- **Python**: Auto-extends to arbitrary precision (BigInt).

An `i32` addition that overflows in Rust debug will panic, while the same code in Python will silently produce the correct result.
"""
fix = "Use checked arithmetic operations or `saturating_add`/`saturating_mul` pattern for portable overflow handling."

[P0110]
title = "Division by zero"
category = "portability"
severity = "error"
summary = "Division by zero produces different results or errors in each target."
description = """
- **JS**: Returns `Infinity` or `NaN` (silently).
- **Dart**: Throws `IntegerDivisionByZeroException`.
- **Python**: Raises `ZeroDivisionError`.
- **Rust**: Panics at runtime.

Division by literal zero is always a programming error and should be prevented.
"""
fix = "Add a guard check: `if divisor != 0 { result = a / b; } else { /* handle error */ }`"

[E0101]
title = "Type mismatch"
category = "type"
severity = "error"
summary = "A value of one type is used where a different type is expected."
description = """
OmniLang checks that expression types match the declared or inferred types at:
- Variable declarations (`let x: i32 = "hello"` → error)
- Return statements (`return "str"` in `fn foo() -> i32` → error)
- Assignment targets (if type is known from declaration)

Type-Erased Targets: JS ignores this error. Dart/Python/Rust enforce at compile time.
"""
fix = "Ensure the expression type matches the declared type. Use explicit conversions if needed."

[E0102]
title = "Missing required field in struct literal"
category = "type"
severity = "error"
summary = "A struct literal is missing one or more required fields that have no default value."
description = """
When constructing a struct literal like `Point { x: 1 }`, all fields without defaults
must be explicitly provided. Missing required fields will cause compile errors in
all target languages.
"""
fix = "Provide values for all required fields, or add default values in the struct definition."

[E0103]
title = "Unknown field in struct literal"
category = "type"
severity = "error"
summary = "A struct literal contains a field name that is not defined in the struct."
description = """
Struct literals can only contain fields that are defined in the struct.
Extra/unknown fields likely indicate a typo or reference to a different type.
"""
fix = "Remove the unknown field or check if you meant a different struct type."

[E0105]
title = "Non-exhaustive match"
category = "type"
severity = "error"
summary = "A match expression does not cover all possible variants of a tagged union."
description = """
When matching on a tagged union (enum-style type), every variant must be handled
or a wildcard `_` pattern must be present. Non-exhaustive matches can cause
runtime errors in all target languages:
- Rust: compile error (enforced by compiler)
- Dart: runtime error from incomplete switch
- JS/Python: potential undefined behavior
"""
fix = "Add missing variant arms to the match expression, or use a wildcard `_` pattern."

[E0201]
title = "await in non-async function"
category = "async"
severity = "error"
summary = "The `await` keyword is used inside a function that is not declared `async`."
description = """
`await` can only be used within `async fn` bodies. Using it in a regular function
will cause a compile error in all target languages.
"""
fix = "Either declare the function as `async fn` or remove the `await` call."

[E0202]
title = "Async function without await"
category = "async"
severity = "warning"
summary = "An async function contains no await expression."
description = """
An `async fn` that never calls `await` serves no purpose and may indicate:
- A forgotten `await` call
- A function that should not be async
- Dead code that was intended to be async
"""
fix = "Either add an `await` call inside the function or remove the `async` modifier."

[E0203]
title = "Unhandled await in Rust"
category = "async"
severity = "warning"
summary = "An await expression in Rust target may need explicit error handling."
description = """
In Rust, `.await` on a `Result`-returning future propagates errors via `?`.
Unhandled Results silently drop errors. Always handle errors with:
- `expr.await?` to propagate
- `.unwrap()` to panic
- `match` for explicit handling
"""
fix = "Add `?` after the await expression, or use `.unwrap()`/`match` for explicit error handling."

[E0306]
title = "Closure escapes with captured variables"
category = "ownership"
severity = "warning"
summary = "A closure that captures variables is returned from or stored outside its defining function."
description = """
When a closure captures local variables and escapes (is returned or stored globally),
the captured variables must live longer than the enclosing function. In Rust, this requires:
- `Cell<T>` for Copy types that are mutated
- `RefCell<T>` for non-Copy types that are mutated
- `move` keyword for ownership transfer

Other targets (JS/Dart/Python) handle this via garbage collection and don't need special treatment.
"""
fix = "Consider using `move` closures or refactoring to avoid escaping captures. The compiler automatically wraps captured variables in Cell/RefCell for Rust."

[F0101]
title = "Unnecessary large copy"
category = "performance"
severity = "perf"
summary = "A large value is being copied when a reference would suffice."
description = """
Copying large structs or arrays can be expensive, especially in Rust where it implies
a deep copy. Using `&` reference or passing by pointer avoids the copy overhead.
"""
fix = "Use `&value` to pass by reference instead of copying, or consider restructuring to avoid the copy."

[P0103]
title = "NaN handling differences"
category = "portability"
severity = "port"
summary = "NaN (Not a Number) comparisons behave differently across language runtimes."
description = """
IEEE 754 specifies that NaN != NaN (NaN is never equal to anything, including itself).
However:
- Some JS engines may optimize NaN checks inconsistently
- Dart VM and dart2js may differ
- Python's `math.isnan()` is recommended over `==`
- Rust uses `f64::is_nan()`
"""
fix = "Use `is_nan(x)` from `omni/math` for portable NaN checking instead of `x == nan`."

[P0104]
title = "String encoding differences"
category = "portability"
severity = "port"
summary = "String encoding and byte representation differ across target platforms."
description = """
- JS: UTF-16 encoded strings
- Dart: UTF-16 strings
- Python: Unicode strings (internal representation varies)
- Rust: UTF-8 encoded strings (String/&str)

Length calculation and byte-level operations produce different results.
"""
fix = "Use `omni/string` utilities for portable string length and byte operations."

[P0105]
title = "Float precision comparison"
category = "portability"
severity = "port"
summary = "Direct float equality comparison may fail due to precision differences across targets."
description = """
Different language runtimes accumulate floating-point rounding differently:
- JS uses 64-bit floats exclusively
- Python uses C doubles (usually 64-bit)
- Dart VM vs dart2js may differ
- Rust debug vs release mode may differ
"""
fix = "Use epsilon-based comparison: `abs(a - b) < epsilon` with an appropriate epsilon value."

[P0106]
title = "Closure capture semantics"
category = "portability"
severity = "port"
summary = "Closure capture (by-reference vs by-value) semantics differ across targets."
description = """
- JS: Captures by reference (mutable)
- Dart: Captures by reference
- Python: Captures by reference; use `nonlocal` for mutation
- Rust: Explicit capture with `move` or borrow; Cell/RefCell for mutation

Code that mutates captured variables behaves differently without explicit annotation.
"""
fix = "The OmniLang compiler automatically handles capture semantics. Be aware of the differences when reading generated code."

[P0107]
title = "Async task scheduling order"
category = "portability"
severity = "port"
summary = "Async task execution order differs across async runtimes."
description = """
- JS: Microtask queue (Promise callbacks run before next event loop tick)
- Dart: Microtask queue with zone support
- Python (asyncio): Tasks yield at await points; order depends on event loop
- Rust (tokio): Work-stealing scheduler; no ordering guarantee

Code depending on specific task ordering is non-portable.
"""
fix = "Use `all()` or `race()` for explicit task coordination. Do not depend on implicit ordering."

[P0111]
title = "Generic type erasure in JavaScript"
category = "portability"
severity = "port"
summary = "Generic type parameters are erased in JavaScript plain mode."
description = """
In JS plain mode, generic type parameters `<T>` are fully erased at compile time.
This means:
- No runtime type checking for generic arguments
- Type constraints are compile-time only
- Cross-module generic calls lose type information
"""
fix = "Switch to TypeScript mode (`target.js.mode = \"typescript\"`) to preserve generic type information."

[S0101]
title = "Unused variable"
category = "style"
severity = "warning"
summary = "A variable is declared but never read."
description = """
Unused variables clutter code and may indicate:
- A misspelled variable name in later usage
- Leftover code from refactoring
- A logic error where the variable should have been used
"""
fix = "Remove the unused variable declaration, or use it in an expression."

[S0102]
title = "Unused import"
category = "style"
severity = "warning"
summary = "An import is never used in the file."
description = """
Unused imports add unnecessary dependencies, slow compilation, and may confuse readers.
They also increase the chance of circular dependency issues.
"""
fix = "Remove the unused import statement."

[S0107]
title = "Structural type coincidence"
category = "style"
severity = "hint"
summary = "A nominal struct is being used in a structurally-compatible position without explicit annotation."
description = """
OmniLang supports both structural typing (by shape) and nominal typing (by name).
When a `nominal` struct type is used where a structurally-compatible type is expected,
it might be unintentional. Consider using explicit type annotation.
"""
fix = "Use `as` cast or add explicit type annotation if the structural match is intentional."

[S0108]
title = "Backslash in import path"
category = "style"
severity = "warning"
summary = "Import path uses backslash (`\\`) instead of forward slash (`/`)."
description = """
OmniLang normalizes all import paths to use forward slashes for cross-platform compatibility.
Backslashes in import paths will fail on Unix/macOS systems.
"""
fix = "Replace `\\` with `/` in import paths."

[SEC0101]
title = "Potential SQL/command injection"
category = "security"
severity = "sec"
summary = "Template string used in a context that may be vulnerable to injection attacks."
description = """
Template strings that interpolate user-provided values into SQL queries, shell commands,
or HTML output can be exploited for injection attacks. This is especially dangerous in
cross-language code where escaping rules differ per target.
"""
fix = "Use parameterized queries, proper escaping, or sanitization functions from `omni/secure`."

[E0104]
title = "Type annotation needed"
category = "type"
severity = "error"
summary = "A variable declaration requires an explicit type annotation because its type cannot be inferred."
description = """
When a variable's type cannot be reliably inferred from the initializer or surrounding context,
an explicit type annotation must be provided. This commonly occurs when a variable is declared
without an initializer (`let x;`) or the initializer is ambiguous. All target languages require
a known type at compile time for code generation.
"""
fix = "Add an explicit type annotation, e.g. `let x: Type = ...`."

[E0106]
title = "Unreachable match arm"
category = "type"
severity = "warning"
summary = "A match arm can never be reached because a previous arm already matches all its cases."
description = """
When a match expression contains a wildcard `_` pattern or a superset pattern earlier in the
arm list, any subsequent arms become unreachable and will never execute. This often indicates
a logic error, dead code, or arms ordered incorrectly. Dead arms are misleading and should be
removed or reordered.
"""
fix = "Remove the dead arm or reorder match arms so the dead arm is checked first."

[E0107]
title = "Recursive type without indirection"
category = "type"
severity = "error"
summary = "A type definition directly or indirectly refers to itself without using a pointer or reference."
description = """
A struct or type that contains itself as a field (directly or indirectly) causes infinite size
at compile time because the compiler cannot determine the type's memory layout. In Rust target
this is a hard error; in other targets it may produce incorrect memory layout. The fix is to
add a layer of indirection via `Box<T>`, `&T`, or `Ref<T>` to break the recursion.
"""
fix = "Wrap the recursive field in `Box<T>` or use `&T` reference for heap allocation."

[E0108]
title = "Method not found on type"
category = "type"
severity = "error"
summary = "A method call references a method that does not exist on the receiver type."
description = """
When calling a method on a value, the method name must be defined on that value's type.
This error occurs when the method is misspelled, the wrong type is used, or the method
belongs to a different type. All target languages enforce this at compile time.
"""
fix = "Check the method name spelling or ensure the receiver type has this method defined."

[E0109]
title = "Generic constraint violation"
category = "type"
severity = "error"
summary = "A type argument supplied to a generic function, struct, or tagged union does not satisfy the declared trait bounds."
description = """
Generic parameters can declare trait bounds (e.g. `T: Display + Clone`) that the concrete type
argument must satisfy. If a type is used that does not implement all required traits, this error
is raised. In a cross-language context, this also covers implicit constraints that targets enforce,
such as Rust's `Sized` bound or JS's object constraints.
"""
fix = "Ensure the type argument implements all required traits, or widen the bounds on the generic parameter."

[E0110]
title = "Unbounded generic type parameter"
category = "type"
severity = "style"
summary = "A generic type parameter is declared without any trait bounds."
description = """
Generic parameters without trait bounds limit expressiveness, especially in Rust target
where methods cannot be called on `T` without explicit bounds. In cross-target code, an
unbounded parameter may behave differently across languages (e.g. JS erases all generics
at runtime). The preferred OmniLang style is to always provide at least one trait bound.
"""
fix = "Add at least one trait bound (e.g. `T: Sized`) to make constraints explicit and improve cross-target portability."

[E0111]
title = "Variant count mismatch"
category = "type"
severity = "warning"
summary = "The number of match arms does not match the number of variants in the tagged union type."
description = """
When matching on a tagged union, the number of arms should match the number of variants
defined for that type. A mismatch suggests that either a variant is unhandled (risking a
runtime error) or there are extraneous arms (dead code). This is similar to non-exhaustive
match checking but focuses on arm count versus variant count.
"""
fix = "Verify all variants are handled in the match expression or add missing arms."

[E0401]
title = "Multiple inheritance not supported"
category = "type"
severity = "error"
summary = "A class extends a base class and also implements other classes, which is not allowed."
description = """
OmniLang does not support multiple class inheritance. A class may extend at most one base class.
Additional interface-like contracts should be expressed using traits via the nominal struct plus
impl pattern. This restriction ensures consistent behavior across all target languages, many of
which have limited or no multiple inheritance support.
"""
fix = "Use a single base class with trait composition, converting extra parents to traits via `nominal struct` + `impl`."

[E0402]
title = "Polymorphic class usage requires trait object"
category = "type"
severity = "warning"
summary = "Polymorphic class usage in Rust target requires `&dyn Trait` object, adding vtable indirection overhead."
description = """
When a variable is typed as an interface or trait rather than a concrete class, Rust generates
a `&dyn Trait` object with vtable indirection. This adds a runtime cost for each method call
and prevents inlining. The warning applies only when Rust is a target language. For
performance-critical code, prefer generics (monomorphization) over trait objects.
"""
fix = "Prefer generics (monomorphization) over trait objects where performance is critical."

[E0310]
title = "Borrow lifetime mismatch"
category = "type"
severity = "error"
summary = "A reference may outlive the value it refers to, causing a dangling reference."
description = """
When a variable is declared in a nested (child) block and then referenced in an outer scope,
the inner variable is dropped when the block ends, leaving a dangling reference. In Rust target
this is a compile error. In GC targets (JS/Python/Dart) the value may still be accessible, but
relying on this behavior is non-portable. The analysis tracks block-scoped lifetimes to detect
references that outlive their referent.
"""
fix = "Extend the variable's lifetime by moving its declaration up, or restructure the code to avoid the dangling reference."

[E0204]
title = "Await in tight loop without yield point"
category = "async"
severity = "warning"
summary = "An `await` expression inside a loop body without a cooperative yield point may starve the event loop."
description = """
A tight loop with `await` expressions but no cooperative yield point (another `await`, `yield`,
or `task_delay` call) can starve other tasks on the same executor. This is especially problematic
in single-threaded targets like Python asyncio or JavaScript, where a single long-running loop
blocks all other async tasks from making progress.
"""
fix = "Add a `task_delay(0)` or `await sleep(0)` at the top of the loop body to allow cooperative scheduling between iterations."

[E0205]
title = "Blocking call in async function"
category = "async"
severity = "error"
summary = "A known blocking call (I/O, sync sleep, CPU-heavy computation) is detected inside an async function."
description = """
Blocking the event-loop thread defeats the purpose of async code and can lead to starvation of
other tasks. This is most severe in single-threaded targets like Python asyncio and JavaScript,
where the entire event loop blocks until the call returns. Known blocking calls include synchronous
I/O operations, thread sleep, mutex locking, and synchronous filesystem operations.
"""
fix = "Use await-based alternatives or wrap the call in `spawn_blocking()` / `asyncio.to_thread()` to avoid blocking the event loop."

[E0206]
title = "Missing error handling in async function"
category = "async"
severity = "warning"
summary = "An async function contains `await` expressions but has no error handling construct."
description = """
Async operations often involve fallible I/O or network calls, and omitting error handling can
lead to unhandled promise rejections or silent failures. In JavaScript this produces unhandled
promise rejections, in Rust the compiler warns about unused Results, and in Python exceptions
may bubble up during event loop execution. The rule checks that the function body contains at
least one try/catch or `.catch()` handler.
"""
fix = "Wrap await expressions with try/catch or add a `.catch()` handler to avoid unhandled promise/exception rejections."

[E0207]
title = "Async main without runtime wrapper"
category = "async"
severity = "warning"
summary = "An `async fn main()` function lacks a runtime wrapper and may not execute correctly."
description = """
An async entry point requires a runtime executor to drive the async tasks. In Rust this requires
a `#[tokio::main]` attribute or explicit `Runtime::block_on()` call. In Python it requires
`asyncio.run()`. Without a wrapper, the async body may never execute or may fail at runtime.
"""
fix = "Wrap the async main call with a runtime executor, using `asyncio.run()` for Python or `#[tokio::main]` / `Runtime::block_on()` for Rust."

[E0307]
title = "Borrow conflict"
category = "ownership"
severity = "error"
summary = "A variable is both mutably borrowed and immutably accessed in the same scope without synchronization."
description = """
This mirrors Rust's borrow checker rules: a variable cannot be mutably borrowed (or assigned)
while it is also immutably referenced in the same scope. In Rust target this causes a compile
error. While JS/Python/Dart allow mutable aliasing, code that violates this pattern will fail
at compile time when targeting Rust.
"""
fix = "Restructure the code to avoid simultaneous mutable and immutable borrows, or use interior mutability (Cell/RefCell) if the pattern is intentional."

[E0308]
title = "Cross-language ownership semantics"
category = "ownership"
severity = "port"
summary = "Ownership patterns may produce different behavior or performance across target languages."
description = """
Ownership and borrowing semantics differ significantly across targets: Rust enforces strict
ownership with borrow checking; C++ uses value semantics with move; Dart, JS, and Python use
garbage collection where everything is a reference. Common flagged patterns include returning
a reference to a local variable (dangling reference in Rust), closures capturing by reference
when they outlive the captured scope, and move semantics that don't translate to GC targets.
"""
fix = "Use explicit `.clone()` for move semantics in GC targets, or restructure to avoid reference lifetime assumptions."

[E0309]
title = "Use of moved value"
category = "ownership"
severity = "error"
summary = "A variable is used after its value has been moved (consumed), which is invalid in Rust target."
description = """
In Rust, values are moved by default when passed to functions, returned, or assigned to another
variable (unless the type implements `Copy`). Using a variable after its value has been moved
causes a compile error. While this pattern is valid in JS/Python/Dart (which use garbage
collection), it will fail in Rust target. The analysis tracks ownership state intra-procedurally
to detect moves of non-copy types.
"""
fix = "Use `.clone()` to preserve the original value, or restructure the code to avoid using the value after the move."

[F0102]
title = "Unnecessary temporary allocation"
category = "performance"
severity = "perf"
summary = "A temporary collection is allocated but only used for iteration, where a range or iterator would suffice."
description = """
Patterns such as constructing a list literal for a single for-in pass, or calling `.to_array()` /
`.collect()` then iterating immediately, create unnecessary heap allocations. In performance-sensitive
code paths, especially in Rust and Dart targets, these allocations add overhead that can be
avoided by using ranges or iterator adapters directly.
"""
fix = "Replace the allocated collection with a range expression or iterator adapter to avoid heap allocation."

[F0103]
title = "Unnecessary box/unbox overhead"
category = "performance"
severity = "perf"
summary = "A value is boxed (heap-allocated) only to be immediately unboxed or dereferenced."
description = """
Wrapping a value in `Box<T>` or calling `.box()` forces heap allocation. If the value is then
immediately dereferenced or unboxed in the same expression, the boxing is redundant and wastes
CPU and memory. This is most relevant in Rust target where `Box` implies a heap allocation but
can also affect performance in other targets that simulate heap allocation.
"""
fix = "Remove the intermediate box()/unbox() and use the value directly on the stack."

[F0104]
title = "Loop-invariant computation"
category = "performance"
severity = "perf"
summary = "An expression whose result does not change across iterations is computed inside a loop."
description = """
Calling `.len()`, `.size()`, `.count()` on an unchanged collection, or recomputing constant
arithmetic inside a loop body, wastes CPU cycles on every iteration. These loop-invariant
expressions should be computed once before the loop and stored in a local variable. This
optimization is especially important in hot loops in Rust, Dart, and JavaScript targets.
"""
fix = "Move invariant expressions before the loop to avoid recomputing the same value on every iteration."

[F0105]
title = "Repeated string concatenation in loop"
category = "performance"
severity = "perf"
summary = "Repeated string concatenation (`+=` or `s = s + ...`) inside a loop creates O(n^2) allocations."
description = """
In many targets (Rust, JS, Dart, Python), repeatedly appending to a string using `+=` or
`s = s + fragment` creates a new string allocation on every iteration, resulting in quadratic
time complexity. For loops with many iterations, this can become a significant performance
bottleneck. A `StringBuilder`, collecting fragments into an array then joining, or using a
dedicated string buffer is much more efficient.
"""
fix = "Use StringBuilder or collect into an array then `.join()` to avoid repeated allocations."

[F0106]
title = "Bounds check elision hint"
category = "performance"
severity = "perf"
summary = "A bounds check on a collection access could be elided with an explicit range hint or assertion."
description = """
Array and collection access in Rust, Dart, and other targets includes runtime bounds checking
to ensure memory safety. When the compiler can prove an index is within bounds (e.g. a loop
from 0 to len), the check can be elided for better performance. This rule hints at opportunities
to add explicit range constraints so the generated code can skip bounds-checking overhead.
"""
fix = "Add an explicit range constraint (e.g. `0..len` loop) or use `.get_unchecked()` to bypass unnecessary bounds checks."

[F0107]
title = "Unnecessary clone"
category = "performance"
severity = "perf"
summary = "A `.clone()` call on a variable that is never used afterward, making a move sufficient."
description = """
When the original variable is never referenced after a `.clone()` call, a simple move would
suffice and avoids the allocation and copying overhead. This is most relevant in Rust target
where `.clone()` performs a deep copy. Unnecessary clones waste CPU and memory and often
indicate a misunderstanding of ownership semantics.
"""
fix = "Use a move (`let y = x;`) instead of `.clone()` to avoid the allocation overhead."

[P0108]
title = "Platform-specific API usage"
category = "portability"
severity = "port"
summary = "A platform-specific API is used without a platform guard, risking compilation failure on other targets."
description = """
Certain APIs only exist on specific platforms (Windows vs Unix, browser vs Node.js). Using
these APIs without a platform guard may cause compilation or runtime failures on other targets.
Examples include Windows registry APIs, Unix process control (`fork`, `kill`), browser DOM APIs
(`alert`, `localStorage`), and Node.js-specific functions (`require`, `process.exit`).
"""
fix = "Guard platform-specific calls behind `#[cfg(target=...)]` or use the `omni/platform` abstraction layer."

[P0112]
title = "Float-to-int precision loss"
category = "portability"
severity = "port"
summary = "An implicit float-to-int conversion may truncate differently across target languages."
description = """
When a floating-point value is implicitly converted to an integer, the truncation behavior
differs across targets: Rust panics on overflow in debug mode, JavaScript uses `ToInt32`,
Python truncates toward negative infinity, and Dart rounds toward zero. Implicit conversions
and explicit casts where precision loss is likely are flagged to ensure the developer chooses
explicit truncation semantics.
"""
fix = "Use an explicit cast (e.g. `x.to_int()` or `as i32`) to make truncation semantics clear and portable."

[P0113]
title = "Regex flavor differences"
category = "portability"
severity = "port"
summary = "A regex pattern contains features that behave differently across target language regex engines."
description = """
Regex engines in JavaScript, Python, Dart, and Rust all support different feature sets.
Backreferences are not supported by Rust's `regex` crate. Lookahead and lookbehind groups have
limited support in older Dart versions. Unicode property escapes behave differently across
engines. Atomic groups and possessive quantifiers are not supported in JavaScript. Using these
features can cause silent failures or compilation errors on unsupported targets.
"""
fix = "Check regex compatibility across JS/Python/Rust/Dart and consider using a compatible sub-pattern or target-conditional code."

[P0114]
title = "Number literal precision across targets"
category = "portability"
severity = "port"
summary = "A large integer literal exceeds the exact-precision range of JavaScript's Number type."
description = """
JavaScript's `Number` type is IEEE-754 double-precision, which can only represent integers up
to 2^53 - 1 (9007199254740991) exactly. Beyond this range, some integers lose precision.
Very large literals may also exceed target-specific type limits (e.g. Rust i64, Dart int limits).
Code that relies on exact large-integer arithmetic will produce incorrect results in JavaScript.
"""
fix = "Use BigInt or a numeric library for exact large-integer arithmetic when targeting JavaScript."

[S0103]
title = "Dead code after return or break"
category = "style"
severity = "warning"
summary = "Statements are unreachable because they follow a return, break, continue, or unconditional exit."
description = """
Code that follows an unconditional control-flow transfer (return, break, continue, or calls to
`exit()`, `panic()`, `unreachable()`) will never execute. Unreachable code is misleading to
readers and should be removed. This can happen after refactoring where a return statement was
added but subsequent code was not removed.
"""
fix = "Remove the dead code or move it before the `return`/`break`/`continue` statement."

[S0104]
title = "Over-complex expression"
category = "style"
severity = "style"
summary = "A deeply nested expression exceeds the recommended nesting depth threshold."
description = """
Expressions with more than the configurable nesting depth threshold (default: 4 levels) are
hard to read, debug, and maintain. Deeply nested code often signals that logic should be broken
into intermediate variables or helper functions for clarity. This improves readability across
all target languages and makes the code easier to review and test.
"""
fix = "Extract sub-expressions into named intermediate variables to improve readability."

[S0105]
title = "Non-idiomatic naming"
category = "style"
severity = "style"
summary = "A function or variable name does not follow the naming conventions of the target language."
description = """
OmniLang compiles to multiple backends, each with its own naming conventions. Rust and Python
expect `snake_case` for functions and variables. JavaScript and Dart expect `camelCase`.
Names that follow one convention may appear jarring or unidiomatic in another target language.
This rule checks names against the conventions of all active targets.
"""
fix = "Rename to follow the target language's naming conventions (snake_case for Rust/Python, camelCase for JS/Dart)."

[S0106]
title = "Mutable variable never mutated"
category = "style"
severity = "style"
summary = "A variable is declared as mutable (`let mut`) but is never reassigned."
description = """
Declaring a variable as mutable when it is never reassigned adds unnecessary complexity and
makes it harder for humans and compilers to reason about the code. The `mut` keyword should
only be used when the variable is actually assigned to after initialization. This is especially
important in Rust target where mutability affects borrow checking.
"""
fix = "Remove the `mut` keyword and declare the variable as immutable: `let x = ...` instead of `let mut x = ...`."

[S0109]
title = "Redundant type annotation"
category = "style"
severity = "hint"
summary = "A type annotation on a variable declaration matches the type trivially inferred from the initializer."
description = """
When the initializer expression makes the type obvious (e.g. literal `42` for i32, `"hello"`
for String), an explicit type annotation adds visual noise without providing additional safety.
Removing redundant annotations improves readability and reduces maintenance burden. Annotations
on generic types (e.g. `Array<i32>`) are not considered redundant.
"""
fix = "Remove the `: Type` annotation and let type inference determine the type from the initializer."

[S0110]
title = "Too many function parameters"
category = "style"
severity = "style"
summary = "A function has more than the recommended maximum number of parameters."
description = """
Functions with many parameters (default threshold: 5) are hard to call correctly, difficult to
test, and a sign that the function may be doing too much. Grouping related parameters into a
struct or configuration object makes the API clearer and reduces the chance of argument ordering
errors. This applies to all target languages.
"""
fix = "Consider grouping related parameters into a struct or configuration object."

[S0111]
title = "Too many local variables"
category = "style"
severity = "style"
summary = "A function contains more than the recommended maximum number of local variables."
description = """
Functions with many local variables (default threshold: 8) are hard to read and maintain. A
high local variable count often indicates that the function is doing too much and should be
split into smaller, focused helper functions. This improves testability and readability across
all target languages.
"""
fix = "Extract related logic into smaller helper functions to reduce the local variable count."

[SEC0102]
title = "Hardcoded credentials"
category = "security"
severity = "sec"
summary = "A string literal or variable assignment appears to contain a hardcoded secret."
description = """
Hardcoded passwords, tokens, API keys, and other secrets are a security risk because they can
be leaked through version control, logs, or binary inspection. The rule flags variable names
matching patterns like `password`, `token`, `api_key`, and also string values that look like
high-entropy secrets (long alphanumeric sequences, base64-like tokens, or hex strings).
"""
fix = "Move the secret to an environment variable or a secrets manager and load it at runtime."

[SEC0103]
title = "Unsafe eval or exec usage"
category = "security"
severity = "sec"
summary = "A call to a dynamic code execution function (`eval`, `exec`, etc.) is detected with a string argument."
description = """
Dynamic code execution functions such as `eval`, `exec`, `Function`, and `setTimeout`/`setInterval`
with a string argument can lead to arbitrary code injection vulnerabilities. An attacker who
controls any part of the evaluated string can execute arbitrary code in the context of the
application. This is almost always avoidable with safer alternatives.
"""
fix = "Replace dynamic code execution with a safer alternative such as a lookup table, a sandboxed parser, or a pre-defined function call."

[E0403]
title = "Interface method not implemented"
category = "type"
severity = "error"
summary = "A class does not implement all required methods from its declared interfaces."
description = """
When a class declares `implements InterfaceName`, it must provide implementations
for all methods defined in that interface. Missing implementations cause compile
errors in all target languages and violate the interface contract.
"""
fix = "Add the missing method implementation to the class, or remove the interface from the implements clause."

[E0501]
title = "Circular module dependency"
category = "type"
severity = "error"
summary = "Modules form a circular dependency cycle, which causes compilation failures."
description = """
Circular imports between modules create a dependency cycle that prevents
proper compilation order. OmniLang uses Tarjan's SCC algorithm to detect
cycles at compile time. All targets reject circular dependencies:
- Rust: compile error (mod cycle)
- JS/Dart: runtime error from hoisting
- Python: ImportError
"""
fix = "Break the cycle by extracting shared types into a separate module or using forward references."

