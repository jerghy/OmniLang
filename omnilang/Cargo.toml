[package]
name = "omnilang"
version = "0.2.0"
edition = "2021"
description = "OmniLang compiler — .omni -> Intent IR -> target code"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
wasm-bindgen = { version = "0.2", optional = true }
serde-wasm-bindgen = { version = "0.6", optional = true }
thiserror = "1"
pathdiff = "0.2"
rayon = "1"
log = "0.4"

[dev-dependencies]
insta = { version = "1", features = ["glob"] }
proptest = "1"

[features]
default = []
wasm = ["wasm-bindgen", "serde-wasm-bindgen"]

# Per-backend codegen feature flags — gate compilation of individual targets.
codegen-react = []
codegen-vue = ["codegen-javascript"]
codegen-dioxus = []
codegen-flutter = ["codegen-dart"]
codegen-dart = []
codegen-rust = []
codegen-python = []
codegen-javascript = []
codegen-omniview = []

# Convenience meta-feature enabling all backends.
all-backends = [
    "codegen-react",
    "codegen-vue",
    "codegen-dioxus",
    "codegen-flutter",
    "codegen-dart",
    "codegen-rust",
    "codegen-python",
    "codegen-javascript",
    "codegen-omniview",
]
