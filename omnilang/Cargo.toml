[package]
name = "omnilang"
version = "0.2.0"
edition = "2021"
description = "OmniLang compiler — .omni -> Intent IR -> target code"

[lib]
crate-type = ["rlib"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
strum = { version = "0.26", features = ["derive"] }
pathdiff = "0.2"
rayon = "1"
log = "0.4"
walkdir = "2"
rustc-hash = "2"
ts-rs = { version = "10", features = ["serde-compat"] }

[dev-dependencies]
insta = { version = "1", features = ["glob"] }
proptest = "1"

[features]
default = []

# Per-backend codegen feature flags — gate compilation of individual targets.
codegen-react = []
codegen-vue = ["codegen-javascript"]
codegen-dioxus = []
codegen-flutter = ["codegen-dart"]
codegen-dart = []
codegen-rust = []
codegen-python = []
codegen-javascript = []
codegen-omniview = []

# Convenience meta-feature enabling all backends.
all-backends = [
    "codegen-react",
    "codegen-vue",
    "codegen-dioxus",
    "codegen-flutter",
    "codegen-dart",
    "codegen-rust",
    "codegen-python",
    "codegen-javascript",
    "codegen-omniview",
]
