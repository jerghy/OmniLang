[package]
name = "omnilang"
version = "0.2.0"
edition = "2021"
description = "OmniLang compiler — .omni -> Intent IR -> target code"

[lib]
crate-type = ["rlib"]

[dependencies]
serde = { version = "1", features = ["derive"] }
omnilang-core = { path = "../crates/omnilang-core" }
serde_json = "1"
rayon = "1"
rustc-hash = "2"
ts-rs = { version = "10", features = ["serde-compat"] }

[dev-dependencies]
insta = { version = "1", features = ["glob"] }
proptest = "1"

[features]
default = ["codegen-omniview", "codegen-react"]

# Per-backend codegen feature flags — gate compilation of individual targets.
# Forward to omnilang-core for shared utilities (event helpers, CSS block gen, etc.).
codegen-react = ["omnilang-core/codegen-react"]
codegen-vue = ["codegen-javascript", "omnilang-core/codegen-vue"]
codegen-dioxus = []
codegen-flutter = ["codegen-dart", "omnilang-core/codegen-flutter"]
codegen-dart = []
codegen-rust = []
codegen-python = []
codegen-javascript = []
codegen-dts = []
codegen-omniview = ["omnilang-core/codegen-omniview"]

# Convenience meta-feature enabling all backends.
all-backends = [
    "codegen-react",
    "codegen-vue",
    "codegen-dioxus",
    "codegen-flutter",
    "codegen-dart",
    "codegen-rust",
    "codegen-python",
    "codegen-javascript",
    "codegen-omniview",
]

# Widget-test harness: regenerates the learn-omniview Flutter output
# project from current codegen and runs the runtime gates (flutter
# analyze; flutter test with OMNILANG_FLUTTER_TEST=1). See
# tests/flutter_widget_tests/README.md.
[[test]]
name = "flutter_widget_tests"
path = "tests/flutter_widget_tests/harness.rs"
required-features = ["codegen-flutter"]
