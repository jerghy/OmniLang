name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  rust:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@v2
      - name: Check workspace
        run: cargo check --workspace
      - name: Build workspace (release)
        run: cargo build --release --workspace
      - name: Run Rust tests
        run: cargo test --workspace
      - name: Upload CLI artifacts
        uses: actions/upload-artifact@v4
        with:
          name: omnilang-${{ matrix.os }}
          path: |
            target/release/omnic
            target/release/omnic.exe
            target/release/omnilang.dll
            target/release/libomnilang.dylib

  tauri:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install frontend dependencies
        run: cd poiesis && npm ci
      - name: Build Tauri app
        run: cd poiesis && npx tauri build
      - name: Upload Tauri artifacts (macOS)
        if: matrix.os == 'macos-latest'
        uses: actions/upload-artifact@v4
        with:
          name: poiesis-macos
          path: |
            poiesis/src-tauri/target/release/bundle/dmg/*.dmg
            poiesis/src-tauri/target/release/bundle/macos/*.app
      - name: Upload Tauri artifacts (Windows)
        if: matrix.os == 'windows-latest'
        uses: actions/upload-artifact@v4
        with:
          name: poiesis-windows
          path: |
            poiesis/src-tauri/target/release/bundle/msi/*.msi
            poiesis/src-tauri/target/release/bundle/nsis/*.exe

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: cd poiesis && npm ci
      - name: Type check
        run: cd poiesis && npx tsc --noEmit
      - name: Build
        run: cd poiesis && npm run build
