name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  rust:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@v2
      - name: Check workspace
        run: cargo check --workspace
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Clippy (strict)
        run: cargo clippy --workspace -- -D warnings
      - name: Build workspace (release)
        run: cargo build --release --workspace
      - name: Run Rust tests
        run: cargo test --workspace
      - name: Check ts-rs bindings freshness
        if: runner.os == 'Linux'
        shell: bash
        run: |
          git diff --exit-code poiesis/src/commands/__generated__/ || {
            echo "ERROR: ts-rs generated files are stale. Run 'cargo test export_bindings --lib -p omnilang' and commit the changes."
            exit 1
          }
      - name: Upload CLI artifacts
        uses: actions/upload-artifact@v4
        with:
          name: omnilang-${{ matrix.os }}
          path: |
            target/release/omnic
            target/release/omnic.exe
            target/release/omnilang.dll
            target/release/libomnilang.dylib

  tauri:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install frontend dependencies
        run: cd poiesis && npm ci
      - name: Build Tauri app
        run: cd poiesis && npx tauri build
      - name: List bundle output (debug)
        if: always()
        shell: bash
        run: |
          echo "=== workspace target ===" && ls -la target/release/*.exe target/release/poiesis* 2>/dev/null || true
          echo "=== local bundle ===" && find poiesis/src-tauri/target -type f 2>/dev/null || true
          echo "=== workspace bundle ===" && find target/release/bundle -type f 2>/dev/null || true
      - name: Upload Tauri artifacts
        uses: actions/upload-artifact@v4
        with:
          name: poiesis-${{ matrix.os }}
          path: |
            poiesis/src-tauri/target/release/bundle/**
            target/release/bundle/**
            target/release/poiesis*
            target/release/poiesis.exe
          if-no-files-found: warn

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: cd poiesis && npm ci
      - name: npm audit
        run: cd poiesis && npm audit --audit-level=high --registry=https://registry.npmjs.org
      - name: Type check
        run: cd poiesis && npx tsc --noEmit
      - name: Check debug-window HTML sync
        run: |
          diff poiesis/src-tauri/debug-window/index.html poiesis/public/debug-window/index.html || \
            (echo "ERROR: debug-window HTML files differ!" && exit 1)
      - name: Unit tests (golden + codegen)
        run: cd poiesis && npx vitest run --config vitest.config.js src/services/codegen/__tests__/
      - name: Build
        run: cd poiesis && npm run build
      - name: Verify dist debug-window has sandbox
        run: |
          grep -q 'sandbox="allow-scripts"' poiesis/dist/debug-window/index.html || \
            (echo "ERROR: dist debug-window missing sandboxed iframe!" && exit 1)
          ! grep -q 'rootEl.innerHTML = payload.html' poiesis/dist/debug-window/index.html || \
            (echo "ERROR: dist debug-window uses direct innerHTML injection (old P38-bypass pattern)!" && exit 1)

  evals:
    runs-on: ubuntu-latest
    needs: rust
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - name: Run OmniLang evals
        run: bash .claude/evals/eval-run-omnilang.sh
      - name: Upload eval results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eval-results
          path: .claude/evals/omnilang-compiler.log
          if-no-files-found: warn

  wasm:
    runs-on: ubuntu-latest
    needs: rust
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          targets: wasm32-unknown-unknown
      - name: Install wasm-pack
        run: curl https://rustwasm.github.io/wasm-pack/installer/init.sh -sSf | sh
      - name: Test omnilang-wasm
        run: wasm-pack test --node omnilang-wasm
      - name: Build WASM (release)
        run: wasm-pack build --release omnilang-wasm
      - name: Upload WASM artifact
        uses: actions/upload-artifact@v4
        with:
          name: omnilang-wasm
          path: omnilang-wasm/pkg/
          retention-days: 7

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - name: Install cargo-audit
        run: cargo install cargo-audit
      - name: Run cargo audit
        run: cargo audit --deny warnings

  test-all-backends:
    runs-on: ubuntu-latest
    needs: rust
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@v2
      - name: Test all backends
        run: cargo test -p omnilang --features all-backends

  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@v2
      - name: Install cargo-llvm-cov
        run: cargo install cargo-llvm-cov --locked
      - name: Run coverage (omnilang-core + omnilang)
        run: cargo llvm-cov --workspace --lib --fail-under-lines 70

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@v2
      - name: Build omnic (release)
        run: cargo build --release -p omnic
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install test app dependencies
        working-directory: test/projects/learn-omniview/build/react-test-app
        run: npm ci
      - name: Regenerate React codegen output
        working-directory: test/projects/learn-omniview
        run: ../../target/release/omnic build --target react -o build/react-test-app
      # Real React gate: strict tsc --noEmit + eslint (react-hooks) over the
      # freshly generated output. Known root-caused errors are documented in
      # scripts/verify-react.exemptions (each entry references its fixing
      # task T1.3/T1.6/T3.3); new errors and stale exemptions fail the gate.
      - name: Real React gate (strict tsc + eslint react-hooks)
        run: bash scripts/verify-react.sh
      - name: Install Playwright browsers
        working-directory: test/projects/learn-omniview/build/react-test-app
        run: npx playwright install chromium
      - name: Run Playwright tests
        working-directory: test/projects/learn-omniview/build/react-test-app
        run: npx playwright test
      - name: Upload Playwright test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-test-results
          path: test/projects/learn-omniview/build/react-test-app/test-results/
          if-no-files-found: warn
      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: test/projects/learn-omniview/build/react-test-app/playwright-report/
          if-no-files-found: warn

  # OmniView-target browser suite (closes deferral #60). Regenerates the
  # gitignored OmniView output (build/index.html + index.js) from source and
  # runs the 44-test suite (tests/omniview-browser.spec.ts via
  # playwright.omniview.config.ts) against the FRESH output — the same
  # "regenerate then test" gate as the React e2e job, for the omniview target.
  omniview-e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@v2
      - name: Build omnic (release)
        run: cargo build --release -p omnic
      - name: Regenerate OmniView output
        run: ./target/release/omnic build test/projects/learn-omniview/src --target omniview -o test/projects/learn-omniview/build
      - name: Install test app dependencies
        working-directory: test/projects/learn-omniview/build/react-test-app
        run: npm ci
      - name: Install Playwright browsers
        working-directory: test/projects/learn-omniview/build/react-test-app
        run: npx playwright install chromium --with-deps
      - name: Run OmniView suite
        working-directory: test/projects/learn-omniview/build/react-test-app
        run: npx playwright test --config=playwright.omniview.config.ts
      - name: Upload OmniView test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: omniview-playwright-test-results
          path: test/projects/learn-omniview/build/react-test-app/test-results/
          if-no-files-found: warn
      - name: Upload OmniView report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: omniview-playwright-report
          path: test/projects/learn-omniview/build/react-test-app/playwright-report/
          if-no-files-found: warn

  smoke-test:
    runs-on: ubuntu-latest
    needs: rust
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install jsdom
        run: npm init -y && npm install jsdom
        working-directory: omnilang/tests
      - name: Run OmniView runtime smoke test
        run: cargo test -p omnilang -- omniview_runtime_smoke --nocapture
      - name: Clean up package.json
        if: always()
        run: rm -f package.json package-lock.json
        working-directory: omnilang/tests

  codegen-validate:
    runs-on: ubuntu-latest
    needs: rust
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      # Matches test/projects/learn-omniview/build/react-test-app (the
      # e2e-validated generated app — react ^19.2.8 / zustand ^5.0.14 /
      # @types/react ^19.2.18; previously pinned at 18.3.1/4.5.0/18.3.0 from
      # the pre-upgrade era, T0.4). The generated_code_validation test
      # resolves tsc + react/zustand/@types/react from this directory.
      - name: Install TypeScript validation dependencies
        working-directory: omnilang/tests
        run: |
          npm init -y
          npm install react@^19 zustand@^5 typescript@5.5.4 @types/react@^19
      # Runs tsc --noEmit over generated React TSX and dart analyze over
      # generated Flutter Dart (graceful SKIPs when a toolchain is missing).
      - name: Test omnilang with codegen-flutter
        run: cargo test -p omnilang --features codegen-flutter
      - name: Clean up npm scaffolding
        if: always()
        run: rm -f package.json package-lock.json
        working-directory: omnilang/tests

  feature-matrix:
    runs-on: ubuntu-latest
    needs: rust
    strategy:
      matrix:
        feature: [codegen-react, codegen-vue, codegen-dioxus, codegen-flutter, codegen-omniview]
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@v2
      - name: Check per-backend feature gate
        run: cargo check -p omnilang --no-default-features --features ${{ matrix.feature }}

  # Doc-compile gate (Task 7.2): every compilable .omni block in the docs
  # (16 guides + BNF spec + design doc) must parse against the current
  # compiler, and the learn-omniview showcase project must build — the
  # compiler is the ground truth; doc divergence fails here (fix the DOC,
  # never the compiler in a docs task). Exemptions (intentionally
  # non-compilable teaching blocks) are listed in scripts/doc-gate-exemptions.txt.
  docs-gate:
    runs-on: ubuntu-latest
    needs: rust
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@v2
      - name: Build omnic (release)
        run: cargo build --release -p omnic
      # Gate output (no -v needed) surfaces the full audit trail: the
      # "N blocks checked (M failed, K semantic notes)" count line plus one
      # NOTE line per waved-through semantic diagnostic — deleted-syntax
      # families (value={sig}, @paused, setValue, capturePointer(id),
      # @slot type constraints, fn-in-store, @themes ';' form, =>) FAIL the
      # gate, so a doc teaching removed syntax is caught in CI.
      - name: Parse-check every compilable doc block
        run: python3 scripts/verify-docs.py --omnic target/release/omnic --check
      # Vocabulary-registry gate (Task 7.1, design P1): cross-asserts the
      # registry against the compiler whitelists (4.2 event table, 4.3 a11y
      # roles, 19-property whitelist, RefOp 10 ops, 13 token types). A
      # whitelist change without a registry sync — or a platform flag name
      # borrowed as semantic vocabulary — fails CI.
      - name: Vocabulary-registry audit
        run: python3 scripts/verify-vocabulary.py --check
      - name: Compile learn-omniview (omniview target)
        working-directory: test/projects/learn-omniview
        run: ../../target/release/omnic build --target omniview -o /tmp/omniview-docs-gate-out
