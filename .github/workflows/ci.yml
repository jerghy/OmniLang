name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  rust-build-and-test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rs/toolchain@v1
        with:
          toolchain: stable
      - name: Build Rust compiler (release)
        run: cd omni-compiler && cargo build --release
      - name: Run Rust tests
        run: cd omni-compiler && cargo test
      - name: Upload DLL artifact
        uses: actions/upload-artifact@v4
        with:
          name: omni_compiler-${{ matrix.os }}
          path: omni-compiler/target/release/omni_compiler.*

  wasm-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rs/toolchain@v1
        with:
          toolchain: stable
          target: wasm32-unknown-unknown
      - name: Install wasm-pack
        run: cargo install wasm-pack
      - name: Build WASM
        run: wasm-pack build omni-compiler --out-dir ../editor/public/wasm --target web --features wasm

  python-tests:
    runs-on: ${{ matrix.os }}
    needs: rust-build-and-test
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Download DLL artifact
        uses: actions/download-artifact@v4
        with:
          name: omni_compiler-${{ matrix.os }}
          path: omni-compiler/target/release/
      - name: Install Python deps
        run: pip install pytest
      - name: Run Python tests
        run: pytest tests/ -v
