name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  rust:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@v2
      - name: Check workspace
        run: cargo check --workspace
      - name: Build workspace (release)
        run: cargo build --release --workspace
      - name: Run Rust tests
        run: cargo test --workspace
      - name: Upload CLI artifacts
        uses: actions/upload-artifact@v4
        with:
          name: omnilang-${{ matrix.os }}
          path: |
            target/release/omnic
            target/release/omnic.exe
            target/release/omnilang.dll
            target/release/libomnilang.dylib

  tauri:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install frontend dependencies
        run: cd poiesis && npm ci
      - name: Build Tauri app
        run: cd poiesis && npx tauri build
      - name: List bundle output (debug)
        if: always()
        shell: bash
        run: |
          echo "=== workspace target ===" && ls -la target/release/*.exe target/release/poiesis* 2>/dev/null || true
          echo "=== local bundle ===" && find poiesis/src-tauri/target -type f 2>/dev/null || true
          echo "=== workspace bundle ===" && find target/release/bundle -type f 2>/dev/null || true
      - name: Upload Tauri artifacts
        uses: actions/upload-artifact@v4
        with:
          name: poiesis-${{ matrix.os }}
          path: |
            poiesis/src-tauri/target/release/bundle/**
            target/release/bundle/**
            target/release/poiesis*
            target/release/poiesis.exe
          if-no-files-found: warn

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: cd poiesis && npm ci
      - name: npm audit
        run: cd poiesis && npm audit --audit-level=high
      - name: Type check
        run: cd poiesis && npx tsc --noEmit
      - name: Build
        run: cd poiesis && npm run build

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - name: Install cargo-audit
        run: cargo install cargo-audit
      - name: Run cargo audit
        run: cargo audit

  clippy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - name: Install Linux system dependencies (Tauri)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libsoup-3.0-dev \
            libjavascriptcoregtk-4.1-dev
      - name: Run clippy (strict mode)
        run: cargo clippy --workspace -- -D warnings
