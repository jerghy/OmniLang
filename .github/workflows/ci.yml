name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  rust:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
      - name: Build workspace
        run: cargo build --release
      - name: Run Rust tests
        run: cargo test --workspace
      - name: Upload DLL artifact
        uses: actions/upload-artifact@v4
        with:
          name: omnilang-${{ matrix.os }}
          path: |
            target/release/omnilang.dll
            target/release/libomnilang.so
            target/release/libomnilang.dylib

  wasm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          target: wasm32-unknown-unknown
      - name: Install wasm-pack
        run: cargo install wasm-pack
      - name: Build WASM
        run: bash scripts/build-wasm.sh

  python:
    runs-on: ${{ matrix.os }}
    needs: rust
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Download DLL artifact
        uses: actions/download-artifact@v4
        with:
          name: omnilang-${{ matrix.os }}
          path: target/release/
      - name: Install omnic
        run: pip install -e omnic/[dev]
      - name: Run Python tests
        run: pytest omnic/tests/ -v

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: cd poiesis && npm ci
      - name: Type check
        run: cd poiesis && npx tsc --noEmit
      - name: Build
        run: cd poiesis && npm run build
