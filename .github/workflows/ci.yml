name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  rust:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@v2
      - name: Check workspace
        run: cargo check --workspace
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Clippy (strict)
        run: cargo clippy --workspace -- -D warnings
      - name: Build workspace (release)
        run: cargo build --release --workspace
      - name: Run Rust tests
        run: cargo test --workspace
      - name: Check ts-rs bindings freshness
        if: runner.os == 'Linux'
        shell: bash
        run: |
          git diff --exit-code poiesis/src/commands/__generated__/ || {
            echo "ERROR: ts-rs generated files are stale. Run 'cargo test export_bindings --lib -p omnilang' and commit the changes."
            exit 1
          }
      - name: Upload CLI artifacts
        uses: actions/upload-artifact@v4
        with:
          name: omnilang-${{ matrix.os }}
          path: |
            target/release/omnic
            target/release/omnic.exe
            target/release/omnilang.dll
            target/release/libomnilang.dylib

  tauri:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install frontend dependencies
        run: cd poiesis && npm ci
      - name: Build Tauri app
        run: cd poiesis && npx tauri build
      - name: List bundle output (debug)
        if: always()
        shell: bash
        run: |
          echo "=== workspace target ===" && ls -la target/release/*.exe target/release/poiesis* 2>/dev/null || true
          echo "=== local bundle ===" && find poiesis/src-tauri/target -type f 2>/dev/null || true
          echo "=== workspace bundle ===" && find target/release/bundle -type f 2>/dev/null || true
      - name: Upload Tauri artifacts
        uses: actions/upload-artifact@v4
        with:
          name: poiesis-${{ matrix.os }}
          path: |
            poiesis/src-tauri/target/release/bundle/**
            target/release/bundle/**
            target/release/poiesis*
            target/release/poiesis.exe
          if-no-files-found: warn

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: cd poiesis && npm ci
      - name: npm audit
        run: cd poiesis && npm audit --audit-level=high
      - name: Type check
        run: cd poiesis && npx tsc --noEmit
      - name: Check debug-window HTML sync
        run: |
          diff poiesis/src-tauri/debug-window/index.html poiesis/public/debug-window/index.html || \
            (echo "ERROR: debug-window HTML files differ!" && exit 1)
      - name: Unit tests (golden + codegen)
        run: cd poiesis && npx vitest run --config vitest.config.js src/services/codegen/__tests__/
      - name: Build
        run: cd poiesis && npm run build
      - name: Verify dist debug-window has sandbox
        run: |
          grep -q 'sandbox="allow-scripts"' poiesis/dist/debug-window/index.html || \
            (echo "ERROR: dist debug-window missing sandboxed iframe!" && exit 1)
          ! grep -q 'rootEl.innerHTML = payload.html' poiesis/dist/debug-window/index.html || \
            (echo "ERROR: dist debug-window uses direct innerHTML injection (old P38-bypass pattern)!" && exit 1)

  evals:
    runs-on: ubuntu-latest
    needs: rust
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - name: Run OmniLang evals
        run: bash .claude/evals/eval-run-omnilang.sh
      - name: Upload eval results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eval-results
          path: .claude/evals/omnilang-compiler.log
          if-no-files-found: warn

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - name: Install cargo-audit
        run: cargo install cargo-audit
      - name: Run cargo audit
        run: cargo audit --deny warnings

  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@v2
      - name: Install cargo-llvm-cov
        run: cargo install cargo-llvm-cov --locked
      - name: Run coverage (omnilang-core + omnilang)
        run: cargo llvm-cov --workspace --lib --fail-under-lines 70

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@v2
      - name: Build omnic (release)
        run: cargo build --release -p omnic
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install test app dependencies
        working-directory: test/projects/learn-omniview/build/react-test-app
        run: npm ci
      - name: Regenerate React codegen output
        working-directory: test/projects/learn-omniview
        run: ../../target/release/omnic build --target react -o build/react-test-app
      - name: Install Playwright browsers
        working-directory: test/projects/learn-omniview/build/react-test-app
        run: npx playwright install chromium
      - name: Run Playwright tests
        working-directory: test/projects/learn-omniview/build/react-test-app
        run: npx playwright test
      - name: Upload Playwright test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-test-results
          path: test/projects/learn-omniview/build/react-test-app/test-results/
          if-no-files-found: warn
      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: test/projects/learn-omniview/build/react-test-app/playwright-report/
          if-no-files-found: warn
