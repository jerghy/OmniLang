name: OmniLang CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  python-tests:
    name: Python ${{ matrix.python-version }} — ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[editor]"
          pip install httpx2 pytest

      - name: Install compiler test deps
        run: |
          pip install lark

      - name: Run compiler tests
        run: python -m pytest tests/ -k "not editor" -v --tb=short

      - name: Run editor server tests
        run: python -m pytest tests/editor/ -v --tb=short

  editor-build:
    name: Editor client build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: editor/client

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: editor/client/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npx tsc --noEmit

      - name: Build
        run: npm run build

  performance-gate:
    name: Performance gates
    needs: [python-tests, editor-build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install deps
        run: |
          pip install -e ".[editor]"
          pip install httpx2 pytest

      - name: Run performance validation
        run: python -m pytest tests/editor/ -v -k "perf" --tb=short 2>&1 || echo "Performance tests not yet implemented — skipping gate"
