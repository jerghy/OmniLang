[workspace]
resolver = "2"
members = [
    "crates/omnilang-core",
    "crates/omnilang-cli",
]

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
clap = { version = "4", features = ["derive"] }
thiserror = "2"
colored = "2"

[workspace.package]
edition = "2021"
license = "MIT"
repository = "https://github.com/omnilang/omnilang"
