[workspace]
resolver = "2"
members = [
    "omnic",
    "omnilang",
    "omnilang-wasm",
    "crates/omnilang-core",
    "poiesis/src-tauri",
    "crates/omnilang-core",
    "crates/omnilang-codegen-omniview",
]

[profile.release]
lto = true
opt-level = "s"
strip = true

[profile.wasm-release]
inherits = "release"
codegen-units = 1
lto = "fat"
opt-level = "z"
strip = true
panic = "abort"
