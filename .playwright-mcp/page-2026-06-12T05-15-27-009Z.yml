    - generic [ref=e19]:
      - textbox [ref=e38]: "import omniview; // ── Stats Store ──────────────────────────────────────── store StatsStore { signal total_users: i32 = 0; signal active_users: i32 = 0; signal revenue: f64 = 0.0; signal orders: i32 = 0; signal growth_rate: f64 = 0.0; getter conversion_rate: f64 = revenue / total_users; getter avg_order_value: f64 = revenue / orders; getter active_pct: f64 = active_users / total_users * 100.0; action update_stats(users: i32, active: i32, rev: f64, ord: i32, growth: f64) { total_users = users; active_users = active; revenue = rev; orders = ord; growth_rate = growth; } } // ── UI Store ─────────────────────────────────────────── store UIStore { signal sidebar_open: bool = true; signal theme: String = \"light\"; signal selected_page: String = \"dashboard\"; getter is_dark: bool = theme == \"dark\"; action toggle_sidebar() { sidebar_open = !sidebar_open; } action set_page(page: String) { selected_page = page; } } // ── Dashboard Component ──────────────────────────────── component Dashboard { @store StatsStore; @store UIStore; signal period: String = \"today\"; fn handle_period(p: String) { period = p; } fn format_number(n: f64) { // Simplified formatting — real implementation in codegen n = n; } view { <Container test-id=\"dashboard\"> <Flex direction=\"row\" gap=\"16px\" align=\"center\"> <Heading level=\"1\" test-id=\"dash-title\">Dashboard</Heading> <Spacer /> <Button onPress={store.toggle_sidebar} test-id=\"btn-toggle-sidebar\">☰</Button> </Flex> <Flex direction=\"row\" gap=\"8px\" test-id=\"period-bar\"> <Button onPress={fn() { handle_period(\"today\"); }} test-id=\"period-today\">Today</Button> <Button onPress={fn() { handle_period(\"week\"); }} test-id=\"period-week\">Week</Button> <Button onPress={fn() { handle_period(\"month\"); }} test-id=\"period-month\">Month</Button> </Flex> <Grid test-id=\"kpi-grid\"> <Card test-id=\"kpi-users\"> <Heading level=\"3\">Total Users</Heading> <Text test-id=\"kpi-users-value\">{store.total_users}</Text> <Text test-id=\"kpi-users-growth\">Growth: {store.growth_rate}%</Text> </Card> <Card test-id=\"kpi-active\"> <Heading level=\"3\">Active Users</Heading> <Text test-id=\"kpi-active-value\">{store.active_users}</Text> <Text test-id=\"kpi-active-pct\">{store.active_pct}% active</Text> </Card> <Card test-id=\"kpi-revenue\"> <Heading level=\"3\">Revenue</Heading> <Text test-id=\"kpi-revenue-value\">${store.revenue}</Text> <Text test-id=\"kpi-aov\">AOV: ${store.avg_order_value}</Text> </Card> <Card test-id=\"kpi-orders\"> <Heading level=\"3\">Orders</Heading> <Text test-id=\"kpi-orders-value\">{store.orders}</Text> <Text test-id=\"kpi-conversion\">Conversion: {store.conversion_rate}%</Text> </Card> </Grid> @if store.sidebar_open { <Container test-id=\"sidebar\"> <Flex direction=\"column\" gap=\"8px\"> <Button onPress={fn() { store.set_page(\"dashboard\"); }} test-id=\"nav-dashboard\">📊 Dashboard</Button> <Button onPress={fn() { store.set_page(\"analytics\"); }} test-id=\"nav-analytics\">📈 Analytics</Button> <Button onPress={fn() { store.set_page(\"settings\"); }} test-id=\"nav-settings\">⚙ Settings</Button> </Flex> </Container> } @if store.total_users == 0 { <Container test-id=\"empty-state\"> <Heading level=\"2\">Welcome!</Heading> <Text>No data yet. Use the buttons above to load sample data.</Text> <Button onPress={fn() { store.update_stats(1250, 843, 45600.0, 312, 12.5); }} test-id=\"btn-load-data\">Load Sample Data</Button> </Container> } </Container> } style { .container { layout: column; gap: 24px; padding: 24px; max_width: 1200px; background: #f5f7fa; } .heading { font_size: 28px; font_weight: bold; } .card { padding: 20px; border_radius: 12px; shadow: md; background: #ffffff; layout: column; gap: 8px; } .kpi_value { font_size: 32px; font_weight: bold; color: #1a1a2e; } .kpi_label { font_size: 14px; color: #666666; } } }"
