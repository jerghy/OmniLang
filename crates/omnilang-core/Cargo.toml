[package]
name = "omnilang-core"
version = "0.2.0"
edition = "2021"
description = "OmniLang compiler core — lexer, parser, semantic analysis, IR, shared codegen infrastructure"

[lib]
crate-type = ["rlib"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
strum = { version = "0.26", features = ["derive"] }
pathdiff = "0.2"
rayon = "1"
log = "0.4"
walkdir = "2"
rustc-hash = "2"
ts-rs = { version = "10", features = ["serde-compat"] }

[features]
# Feature flags for web-specific shared utilities (event helpers, CSS block generation).
# External codegen crates that need DOM/CSS utilities enable the relevant feature.
codegen-omniview = []
codegen-react = []
codegen-vue = []
codegen-javascript = []
codegen-dart = []
codegen-flutter = []
codegen-rust = []
codegen-dioxus = []
codegen-python = []

[dev-dependencies]
insta = { version = "1", features = ["glob"] }
proptest = "1"
