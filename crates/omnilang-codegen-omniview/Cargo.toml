[package]
name = "omnilang-codegen-omniview"
version = "0.2.0"
edition = "2021"
description = "OmniView codegen backend for OmniLang"

[lib]
crate-type = ["rlib"]

[dependencies]
omnilang-core = { path = "../omnilang-core", features = ["codegen-omniview"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rustc-hash = "2"

[dev-dependencies]
insta = { version = "1", features = ["glob"] }
proptest = "1"
