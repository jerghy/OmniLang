    <style>.dashboard {
  max-width: 800px;
  padding: 24px;
  font-family: system-ui;

.title {

  padding: 6px;
}

.theme-btn-green {
  color: white;

  border-style: none;

}

.theme-btn-purple {

  border-style: none;
  padding: 6px;

}

  font-weight: 600;
}

}

.btn-reset {

.btn-plus {
