[package]
name = "omni-compiler"
version = "0.1.0"
edition = "2021"
description = "OmniLang compiler — .omni -> Intent IR -> target code"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Error handling
thiserror = "1"

[features]
default = []
native = []

[profile.release]
lto = true
opt-level = "s"
strip = true
