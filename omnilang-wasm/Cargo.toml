[package]
name = "omnilang-wasm"
version = "0.2.0"
edition = "2021"
description = "WASM bindings for the OmniLang compiler"

[package.metadata.wasm-pack.profile.release]
wasm-opt = ["-O", "--enable-bulk-memory", "--enable-nontrapping-float-to-int"]

[lib]
crate-type = ["cdylib", "rlib"]

[dev-dependencies]
# 0.3.x is the current test-crate line; it pins wasm-bindgen =0.2.126
# (already in the workspace lockfile). The older 0.2.50 test crate's
# metadata is unreadable by the installed wasm-bindgen-test-runner
# (0.2.125) — the harness reported "no tests to run" with it.
wasm-bindgen-test = "0.3.76"

[dependencies]
omnilang = { path = "../omnilang" }
wasm-bindgen = "0.2"
serde-wasm-bindgen = "0.6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rustc-hash = "2"

[features]
default = ["codegen-omniview"]
codegen-omniview = ["omnilang/codegen-omniview"]
