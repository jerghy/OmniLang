[project]
name = "omnilang"
version = "0.2.0.dev0"
description = "OmniLang — compile once, run everywhere. Transpile to Rust, Dart, JS, and Python with cross-language static analysis."
requires-python = ">=3.10"
dependencies = [
    "lark-parser>=1.1",
    "tomli>=2.0; python_version < '3.11'",
]

[project.optional-dependencies]
dev = [
    "pytest>=7",
]

[project.scripts]
omnic = "omnilang.cli:main"

[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"
