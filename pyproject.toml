[project]
name = "omnilang"
version = "0.2.0.dev0"
description = "OmniLang — compile once, run everywhere. Transpile to Rust, Dart, JS, and Python with cross-language static analysis."
requires-python = ">=3.10"
dependencies = [
    "lark>=1.1",
    "tomli>=2.0; python_version < '3.11'",
]

[project.optional-dependencies]
dev = [
    "pytest>=7",
]
editor = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
]

[project.scripts]
omnic = "omniview.cli:main"

[tool.setuptools.packages.find]
include = ["omnilang*", "omniview*", "editor*"]
exclude = ["build*", "tests*", "tools*", "scripts*", "docs*"]

[tool.pytest.ini_options]
markers = [
    "require_rust: test requires Rust compiler DLL",
]

[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"
